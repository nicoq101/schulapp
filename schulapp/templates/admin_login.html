<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Admin-Login – Schulapp</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0A0A0B; color: #F5F5F5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .box { background: #17181B; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 28px; width: 300px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: #8A8D93; margin: 12px 0 6px; }
  input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: #1F2024; color: #F5F5F5; box-sizing: border-box; font-size: 14px; }
  button { width: 100%; margin-top: 18px; padding: 12px; border-radius: 12px; border: none; background: #FFFFFF; color: #0A0A0B; font-weight: 600; cursor: pointer; }
  .error { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="box">
    <h1>🔒 Admin-Login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="/admin/login">
      <label>Passwort</label>
      <input type="password" name="password" required />
      <label>2FA-Code (Authenticator-App)</label>
      <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" required />
      <button type="submit">Anmelden</button>
    </form>
  </div>
</body>
</html>
