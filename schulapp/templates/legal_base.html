<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}Rechtliches{% endblock %} – Schulapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0B; --surface: #17181B; --text: #F5F5F5; --text-muted: #8A8D93;
    --border: rgba(255,255,255,0.10); --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 32px 20px 80px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 24px; margin: 0 0 24px; }
  h2 { font-family: 'Space Grotesk', sans-serif; font-size: 16px; margin: 28px 0 10px; color: var(--text); }
  p, li { font-size: 14px; line-height: 1.7; color: var(--text-muted); }
  a { color: var(--text); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; }
  .fill { color: var(--text); background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 4px; }
  .back { display:inline-block; margin-bottom: 20px; font-size: 13px; color: var(--text-muted); text-decoration:none; }
  .hinweis { font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 24px; padding-top: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← Zurück zur App</a>
    <div class="card">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
